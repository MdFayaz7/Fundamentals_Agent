[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resultagent"
version = "0.1.0"
description = "Results Flash Agent: NSE/BSE result filing alerts to Telegram"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "pypdfium2>=4.30",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["resultagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
